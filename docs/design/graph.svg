<text class="kind" x="48" y="905">A Thread walks from its task</text>
<text class="st" x="48" y="924">1  The brief: the task, and one hop of cards</text>
<text class="st" x="48" y="941">2  Read one section, by its line range</text>
<text class="st" x="48" y="958">3  Follow a [[link]], or grep GRAPH.md</text>
<text class="kind" x="468" y="905">The Shuttle walks from open work</text>
<text class="st" x="468" y="924">1  The ledger: every task with a Thread</text>
<text class="st" x="468" y="941">    or waiting on the owner, as cards</text>
<text class="st" x="468" y="958">2  Grep GRAPH.md, then at most three reads</text>
