<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1013" width="1240" height="1013" role="img" aria-labelledby="t d">
<title id="t">Loom's graph: nodes, their attributes and the edges between them</title>
<desc id="d">The Shuttle enters at open work and keeps its past sessions by date. A project is the root task; a task may be part of another. Several Threads weave one task, and a later Thread continues an earlier one from its report. A task's timeline lists its edges in order. Artifacts are documents, links or repositories, each a file; they document tasks and mention each other. Each node lists stored attributes, then derived ones. The same facts are in graph.md.</desc>
<style>
  svg { --paper:#f3efe4; --card:#fbf9f3; --sunk:#ebe6d8; --ink:#1d1b16; --ink2:#5d584c; --rule:#d8d1bf; --accent:#c2401b; --slate:#34587a; --amber:#a86a10; }
  @media (prefers-color-scheme: dark) { svg { --paper:#15140f; --card:#1d1b15; --sunk:#100f0b; --ink:#ebe5d5; --ink2:#aaa392; --rule:#35312a; --accent:#ee7446; --slate:#86acd0; --amber:#d9a441; } }
  text { font: 11.5px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
  .bg { fill: var(--paper); }
  .h1 { font: 22px Georgia, "Times New Roman", serif; }
  .sub { font-size: 13px; fill: var(--ink2); }
  .cap { font-size: 10.5px; letter-spacing: .09em; fill: var(--ink2); }
  .card { fill: var(--card); stroke: var(--rule); }
  .band { fill: var(--sunk); stroke: var(--rule); }
  .head { stroke: var(--rule); fill: none; }
  .dash { stroke: var(--rule); stroke-dasharray: 2 3; fill: none; }
  .kind { font: 13.5px Georgia, "Times New Roman", serif; }
  .addr { font: 11px ui-monospace, Menlo, Consolas, monospace; fill: var(--accent); }
  .dv { font-style: italic; fill: var(--ink2); }
  .sec { fill: var(--sunk); stroke: var(--rule); }
  .sec.hot { stroke: var(--slate); stroke-width: 1.5; }
  .mark { fill: none; stroke: var(--accent); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .e { fill: none; stroke: var(--ink2); stroke-width: 1.4; stroke-linejoin: round; }
  .ed { stroke: var(--slate); stroke-dasharray: 5 4; }
  .walk { stroke: var(--accent); }
  .el { font-size: 11px; fill: var(--ink2); }
  #a path { fill: var(--ink2); } #ad path { fill: var(--slate); }
</style>
